services:
  web:
    build: .
    command: >
      sh -c "alembic upgrade head &&
      uvicorn main:app --host 0.0.0.0 --port 8091
      --workers 4
      --timeout-keep-alive 5
      --limit-concurrency 256
      --limit-max-requests 10000
      --proxy-headers --forwarded-allow-ips 10.0.0.0/8
      --no-server-header"
    expose:
      - 8091
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8443}
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      # Static assets are served by the proxy, so they never reach the app.
      - ./app/static/:/srv/static/:ro
      # Certificate and key are supplied by the platform, not built into an
      # image. TLS_DIR must point at a directory holding server.crt/server.key.
      - ${TLS_DIR:?TLS_DIR must point at the directory holding server.crt and server.key}:/etc/nginx/tls/:ro
  db:
    image: postgres:15.4-alpine
    volumes:
      - pg_volume:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD", "sh", "-c", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      start_period: 5s
    expose:
      - 5432
volumes:
  pg_volume:
