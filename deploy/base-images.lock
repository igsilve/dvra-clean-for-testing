# Pinned base image digests.
#
# The Dockerfile references these digests directly rather than the tags, so
# a rebuild produces the same base every time. This file exists so that the
# tag each digest corresponds to, and the date it was resolved, are written
# down; a bare digest in a Dockerfile tells a reader nothing about how old
# it is or what it was supposed to be.
#
# Changing a digest here is a reviewed change. Before promoting one:
#   1. Resolve the new digest for the intended tag.
#   2. Run the image vulnerability scan against it.
#   3. Verify the image signature and provenance.
#   4. Update both this file and the Dockerfile in the same commit.
#
# Refresh on a schedule as well as on demand. A pinned digest is immutable,
# which is the point, but it also means security patches in the base are not
# picked up until someone repins.

