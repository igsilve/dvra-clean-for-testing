worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Normalise request framing at the edge so the proxy and the application
    # server can never disagree about where a request ends (request smuggling).
    # nginx rejects a request carrying both Content-Length and
    # Transfer-Encoding, and only ever speaks HTTP/1.1 upstream.
    ignore_invalid_headers on;
    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 5s;
    send_timeout 10s;

    upstream app {
        server web:8091;
        keepalive 16;
    }

    server {
        listen 8443;
        http2 on;

        # Reject ambiguous framing before it reaches the application server.
        if ($http_transfer_encoding != "") {
            return 400;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_pass http://app;
        }
    }
}
