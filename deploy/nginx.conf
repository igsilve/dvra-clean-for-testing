worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Protocol-level work belongs on this dedicated front-end module rather
    # than in the application process: TLS termination, request framing
    # normalisation, body-size ceilings and static asset delivery all happen
    # here, and the application server is reachable only on the internal
    # network behind it.
    ignore_invalid_headers on;
    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 5s;
    send_timeout 10s;

    # TLS is terminated at the edge. The certificate and key are supplied by
    # the platform (mounted secrets), never baked into an image.
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    upstream app {
        server web:8091;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        http2 on;

        # Reject ambiguous framing before it reaches the application server.
        # nginx refuses a request carrying both Content-Length and
        # Transfer-Encoding, and only ever speaks HTTP/1.1 upstream, so the
        # two hops can never disagree about where a request ends.
        if ($http_transfer_encoding != "") {
            return 400;
        }

        # Static assets are served by the proxy, so requests for them never
        # reach the application process.
        location /static/ {
            alias /srv/static/;
            autoindex off;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=3600" always;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_pass http://app;
        }
    }
}
